<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open verified WPE lesson · Learn → Challenge</title><link rel="stylesheet" href="../../site.css">
<style>body{background:#f3f8fa;color:#193d50;font:16px/1.55 system-ui,sans-serif;margin:0}main{max-width:750px;margin:8vh auto;padding:26px;background:white;border:1px solid #c9dce6;border-radius:12px}a{color:#166d7a}a:focus-visible{outline:3px solid #d89c35;outline-offset:3px}</style></head><body>
<main><h1 id="title">Checking your question and lesson…</h1><p id="message">This older lesson link will open its verified destination directly.</p><p><a id="destination" href="learn-challenge.html">Choose a learning route</a></p><p>Lessons open as full pages without iframes. Practice is not an official answer key.</p></main>
<script>
(async()=>{
"use strict";
const query=new URLSearchParams(location.search),source=query.get("question"),lesson=query.get("lesson"),variant=query.get("variant");
const title=document.getElementById("title"),message=document.getElementById("message"),link=document.getElementById("destination");
if(!/^[A-Za-z0-9-]{2,64}$/.test(source||"")||!/^(C0[1-8]|E0[1-5]|F0[1-3])$/.test(lesson||"")||(variant&&!(lesson.startsWith("F")&&variant==="transfer55"))){
 title.textContent="This old link has no verified destination.";message.textContent="Choose a known question and lesson from Learn → Challenge.";return;
}
try{
 const [r,b]=await Promise.all([fetch("learning-coverage-r1.json",{cache:"no-store"}),fetch("../../workspace/output/WPE_Core2_Consolidated_20261102/native-candidate/selected_bank.review.json",{cache:"no-store"})]);
 if(!r.ok||!b.ok)throw Error("Source evidence unavailable");
 const data=await r.json(),bank=await b.json();
 if(data.schema!=="wpe-learner-coverage-r1/v1"||data.questions?.length!==74||bank.questions?.length!==74)throw Error("Inventory changed");
 const row=data.questions.find(x=>x.source_id===source),original=bank.questions.find(x=>x.source_id===source);
 if(!row||row.primary_lesson!==lesson||row.fit==="MISSING_CONSTRUCTION"||!original||row.stem_sha256!==original.stem_sha256)throw Error("Unverified source-to-lesson pairing");
 const page=lesson.startsWith("C")?"d3d4-self-tutor.html":lesson.startsWith("E")?"extension-learning.html":"focused-journeys.html";
 const target=page+"?question="+encodeURIComponent(source)+(variant?"&variant=transfer55":"")+"#"+lesson;
 title.textContent="Opening "+lesson+" from "+source;message.textContent="Your original question remains independent of this lesson.";
 link.href=target;link.textContent="Open "+lesson+" directly";location.replace(target);
}catch(_){title.textContent="No verified lesson destination";message.textContent="The source record or mapped lesson cannot be confirmed, so no lesson is guessed.";}
})();
</script></body></html>
