<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Continue to verified WPE lesson</title><link rel="stylesheet" href="../../site.css">
<style>body{font:16px/1.5 system-ui,sans-serif;background:#f3f8fa;color:#1b3c51}main{max-width:720px;margin:7vh auto;padding:20px;background:white;border:1px solid #bcd3df;border-radius:12px}a{color:#135976}a:focus-visible{outline:3px solid #d4a543}</style></head>
<body><main><h1>Continue to the lesson</h1>
<p id="status" role="status">Verifying the exact question and lesson before direct navigation…</p>
<p><a id="direct" hidden href="learn-challenge.html">Open the verified lesson</a></p>
<p><a href="learn-challenge.html#question-routes">Choose a learning route</a> · <a href="question-bank.html">Question Bank</a></p>
<p>Lessons open directly, with no iframe. Related practice does not guarantee complete teaching of an original question.</p></main>
<script>
(async()=>{
"use strict";
const params=new URLSearchParams(location.search),question=params.get("question"),lesson=params.get("lesson"),variant=params.get("variant");
const status=document.getElementById("status"),direct=document.getElementById("direct");
if(!/^[A-Za-z0-9-]{2,64}$/.test(question||"")||!/^(C0[1-8]|E0[1-5]|F0[1-3])$/.test(lesson||"")||(variant&&!["first","transfer"].includes(variant))){status.textContent="Invalid question, lesson or challenge variant. No destination inferred.";return;}
try{
const [a,b]=await Promise.all([fetch("learning-coverage-r1.json"),fetch("../../workspace/output/WPE_Core2_Consolidated_20261102/native-candidate/selected_bank.review.json")]);
if(!a.ok||!b.ok)throw Error("Source unavailable");
const map=await a.json(),bank=await b.json();
if(map.schema!=="wpe-learner-coverage-r1/v1"||map.questions?.length!==74||bank.questions?.length!==74)throw Error("Inventory changed");
const row=map.questions.find(x=>x.source_id===question),original=bank.questions.find(x=>x.source_id===question);
if(!row||!original||row.stem_sha256!==original.stem_sha256||row.primary_lesson!==lesson||row.fit==="MISSING_CONSTRUCTION")throw Error("No exact lesson mapping");
if(variant==="transfer"&&!lesson.startsWith("F"))throw Error("No transfer challenge");
const page=lesson.startsWith("C")?"d3d4-self-tutor.html":lesson.startsWith("E")?"extension-learning.html":"focused-journeys.html";
const target=new URL(page,location.href);target.searchParams.set("question",question);
if(variant==="transfer")target.searchParams.set("variant","transfer");
target.hash=lesson;
direct.href=target.href;direct.textContent="Open "+lesson+" for "+question;direct.hidden=false;
status.textContent=(row.fit==="RELATED_BRIDGE"?"Related practice only":row.fit==="TARGETED_PRACTICE"?"Close practice match":"Focused teaching")+". Opening the existing lesson directly.";
location.replace(target.href);
}catch(_){status.textContent="The exact source-to-lesson match could not be verified. Select a route from the learning gateway.";direct.hidden=true;}
})();
</script></body></html>
