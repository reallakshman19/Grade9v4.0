<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-labelledby="title desc"><title id="title">Stated force and displacement directions</title><desc id="desc">A trolley with an upward force arrow and a rightward displacement arrow. These are the directions already given in the synthetic question.</desc><rect x="115" y="150" width="110" height="45" rx="5" fill="#e3edf4" stroke="#254b65" stroke-width="3"/><circle cx="140" cy="207" r="10" fill="#254b65"/><circle cx="200" cy="207" r="10" fill="#254b65"/><path d="M170 145 V55 M160 68 L170 55 L180 68" fill="none" stroke="#167260" stroke-width="4"/><text x="195" y="90" font-family="sans-serif" font-size="20">stated force</text><path d="M220 175 H300 M286 165 L300 175 L286 185" fill="none" stroke="#254b65" stroke-width="4"/><text x="220" y="145" font-family="sans-serif" font-size="16">displacement</text></svg>