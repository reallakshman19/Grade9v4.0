<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #1e293b; }
      .dim { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #475569; }
      .axis { stroke: #64748b; stroke-width: 2; }
      .line { stroke: #2563eb; stroke-width: 3; }
      .grid { stroke: #cbd5e1; stroke-dasharray: 4 4; stroke-width: 1.5; }
    </style>
  </defs>
  <!-- Axes -->
  <line x1="60" y1="210" x2="380" y2="210" class="axis"/>
  <line x1="60" y1="210" x2="60" y2="30" class="axis"/>
  <text x="390" y="215" class="label">t (s)</text>
  <text x="35" y="35" class="label">v (m/s)</text>
  
  <!-- Velocity Line from (0, 50) to (2, 40) to (10, 0) -->
  <line x1="60" y1="50" x2="160" y2="82" class="line"/>
  <line x1="160" y1="82" x2="360" y2="210" class="line" stroke-dasharray="4 4"/>
  
  <!-- Points -->
  <circle cx="60" cy="50" r="5" fill="#dc2626"/>
  <text x="50" y="55" class="dim" text-anchor="end">50</text>
  
  <circle cx="160" cy="82" r="5" fill="#dc2626"/>
  <line x1="160" y1="82" x2="160" y2="210" class="grid"/>
  <text x="160" y="230" class="dim" text-anchor="middle">t = 2s</text>
  <text x="150" y="80" class="dim" text-anchor="end">40</text>
  
  <circle cx="360" cy="210" r="5" fill="#0f172a"/>
  <text x="360" y="230" class="dim" text-anchor="middle">t = 10s</text>
  <text x="210" y="65" class="label" style="fill:#2563eb;">m = 10 kg</text>
</svg>