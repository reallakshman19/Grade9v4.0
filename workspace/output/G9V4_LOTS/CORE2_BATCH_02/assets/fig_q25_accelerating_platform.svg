<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #1e293b; }
      .platform { fill: #94a3b8; stroke: #1e293b; stroke-width: 2.5; }
      .block { fill: #e2e8f0; stroke: #1e293b; stroke-width: 2; rx: 4; }
    </style>
  </defs>
  <!-- Platform -->
  <rect x="90" y="160" width="200" height="24" class="platform"/>
  <text x="190" y="177" class="label" text-anchor="middle" fill="#ffffff">Platform</text>
  
  <!-- Block of mass m -->
  <rect x="155" y="96" width="70" height="64" class="block"/>
  <text x="190" y="134" class="label" text-anchor="middle">m</text>
  
  <!-- Acceleration arrow a -->
  <line x1="315" y1="160" x2="315" y2="100" stroke="#16a34a" stroke-width="3"/>
  <polygon points="310,105 315,92 320,105" fill="#16a34a"/>
  <text x="325" y="130" class="label" style="fill:#16a34a;">a = g/2</text>
  
  <!-- Gravity arrow g -->
  <line x1="60" y1="100" x2="60" y2="160" stroke="#dc2626" stroke-width="2"/>
  <polygon points="56,155 60,165 64,155" fill="#dc2626"/>
  <text x="45" y="135" class="label" style="fill:#dc2626;">g</text>
</svg>