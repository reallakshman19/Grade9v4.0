<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #1e293b; }
      .dim { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #475569; }
      .axis { stroke: #64748b; stroke-width: 2; }
      .curve { stroke: #2563eb; stroke-width: 3; fill: none; }
      .emech { stroke: #dc2626; stroke-dasharray: 6 4; stroke-width: 2; }
      .grid { stroke: #cbd5e1; stroke-dasharray: 4 4; stroke-width: 1.5; }
    </style>
  </defs>
  <!-- Axes -->
  <line x1="50" y1="210" x2="400" y2="210" class="axis"/>
  <line x1="50" y1="210" x2="50" y2="30" class="axis"/>
  <text x="410" y="215" class="label">x</text>
  <text x="35" y="35" class="label">U(x)</text>
  
  <!-- Emech = 8 J line -->
  <line x1="50" y1="60" x2="390" y2="60" class="emech"/>
  <text x="395" y="65" class="label" style="fill:#dc2626;">E_mech = 8 J</text>
  
  <!-- Potential Profile U(x) -->
  <path d="M 50 60 L 110 60 L 180 180 L 250 80 L 320 150 L 380 150" class="curve"/>
  
  <!-- Coordinate markers x1, x2, x3, x4 -->
  <circle cx="110" cy="60" r="4" fill="#0f172a"/>
  <line x1="110" y1="60" x2="110" y2="210" class="grid"/>
  <text x="110" y="230" class="dim" text-anchor="middle">x1</text>
  
  <circle cx="180" cy="180" r="4" fill="#0f172a"/>
  <line x1="180" y1="180" x2="180" y2="210" class="grid"/>
  <text x="180" y="230" class="dim" text-anchor="middle">x2 (U_min)</text>
  
  <circle cx="250" cy="80" r="4" fill="#0f172a"/>
  <line x1="250" y1="80" x2="250" y2="210" class="grid"/>
  <text x="250" y="230" class="dim" text-anchor="middle">x3</text>
  
  <circle cx="320" cy="150" r="4" fill="#0f172a"/>
  <line x1="320" y1="150" x2="320" y2="210" class="grid"/>
  <text x="320" y="230" class="dim" text-anchor="middle">x4 (Plateau)</text>
</svg>