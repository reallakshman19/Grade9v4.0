<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #1e293b; }
      .dim { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #475569; }
      .traj { stroke: #0284c7; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
      .axis { stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>
  <!-- Ground axis -->
  <line x1="40" y1="210" x2="380" y2="210" class="axis"/>
  
  <!-- Trajectory Parabola -->
  <path d="M 60 210 Q 210 40 360 210" class="traj"/>
  
  <!-- Points A, B, C -->
  <circle cx="60" cy="210" r="5" fill="#0f172a"/>
  <text x="50" y="235" class="label">A (K)</text>
  
  <circle cx="210" cy="125" r="5" fill="#0f172a"/>
  <text x="210" y="110" class="label" text-anchor="middle">B (Apex)</text>
  
  <circle cx="360" cy="210" r="5" fill="#0f172a"/>
  <text x="360" y="235" class="label" text-anchor="middle">C</text>
  
  <!-- Angle theta = 60 deg -->
  <path d="M 90 210 A 30 30 0 0 0 83 188" stroke="#e11d48" stroke-width="2" fill="none"/>
  <text x="100" y="195" class="label" style="fill:#e11d48;">60°</text>
  
  <!-- Launch velocity vector -->
  <line x1="60" y1="210" x2="110" y2="135" stroke="#0f172a" stroke-width="2"/>
  <polygon points="107,133 113,130 113,138" fill="#0f172a"/>
</svg>