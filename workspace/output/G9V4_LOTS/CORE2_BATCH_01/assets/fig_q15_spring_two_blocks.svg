<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #1e293b; }
      .ground { stroke: #64748b; stroke-width: 2.5; }
      .block { fill: #e2e8f0; stroke: #1e293b; stroke-width: 2; rx: 4; }
      .spring { stroke: #0284c7; stroke-width: 2.5; fill: none; }
    </style>
  </defs>
  <!-- Horizontal floor -->
  <line x1="40" y1="170" x2="380" y2="170" class="ground"/>
  
  <!-- Left Block (250g) -->
  <rect x="90" y="120" width="55" height="48" class="block"/>
  <text x="117" y="150" class="label" text-anchor="middle">250g</text>
  
  <!-- Left velocity arrow -->
  <line x1="80" y1="144" x2="50" y2="144" stroke="#e11d48" stroke-width="2"/>
  <polygon points="52,140 44,144 52,148" fill="#e11d48"/>
  <text x="55" y="132" class="label" style="fill:#e11d48;">v</text>
  
  <!-- Horizontal Spring -->
  <path d="M 145 144 L 160 130 L 175 158 L 190 130 L 205 158 L 220 130 L 235 158 L 250 130 L 265 158 L 275 144" class="spring"/>
  <text x="210" y="120" class="label" style="fill:#0284c7;" text-anchor="middle">k = 2 N/m</text>
  
  <!-- Right Block (250g) -->
  <rect x="275" y="120" width="55" height="48" class="block"/>
  <text x="302" y="150" class="label" text-anchor="middle">250g</text>
  
  <!-- Right velocity arrow -->
  <line x1="340" y1="144" x2="370" y2="144" stroke="#e11d48" stroke-width="2"/>
  <polygon points="368,140 376,144 368,148" fill="#e11d48"/>
  <text x="355" y="132" class="label" style="fill:#e11d48;">v</text>
</svg>