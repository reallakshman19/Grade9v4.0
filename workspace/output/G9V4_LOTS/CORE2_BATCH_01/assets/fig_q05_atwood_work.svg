<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 270" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #1e293b; }
      .rope { stroke: #334155; stroke-width: 2; fill: none; }
      .block { fill: #e2e8f0; stroke: #1e293b; stroke-width: 2; rx: 4; }
    </style>
  </defs>
  <!-- Support -->
  <line x1="140" y1="25" x2="240" y2="25" stroke="#475569" stroke-width="4"/>
  <line x1="190" y1="25" x2="190" y2="55" stroke="#475569" stroke-width="3"/>
  <circle cx="190" cy="70" r="22" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="190" cy="70" r="4" fill="#0f172a"/>
  
  <!-- Ropes -->
  <line x1="168" y1="70" x2="168" y2="170" class="rope"/>
  <line x1="212" y1="70" x2="212" y2="130" class="rope"/>
  
  <!-- 200g Block (descending) -->
  <rect x="148" y="170" width="40" height="38" class="block" style="fill:#cbd5e1;"/>
  <text x="168" y="194" class="label" text-anchor="middle">200 g</text>
  
  <!-- 100g Block (ascending) -->
  <rect x="195" y="130" width="34" height="32" class="block"/>
  <text x="212" y="152" class="label" text-anchor="middle">100 g</text>
  
  <!-- Gravity -->
  <line x1="270" y1="80" x2="270" y2="120" stroke="#e11d48" stroke-width="2"/>
  <polygon points="266,115 270,123 274,115" fill="#e11d48"/>
  <text x="280" y="105" class="label" style="fill:#e11d48;">g</text>
</svg>