name: WPE C01–C08 + E01–E05 Six-Stage Self-Tutor UI QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "physics/wpe/d3d4-self-tutor.html"
      - "physics/wpe/d3d4-self-tutor.css"
      - "physics/wpe/d3d4-self-tutor.js"
      - "physics/wpe/d3d4-self-tutor.review.json"
      - "physics/wpe/index.html"
      - "physics/wpe/reasoning-paths.html"
      - "physics/wpe/question-coverage.html"
      - "preview/question-status.html"
      - "workspace/output/WPE_Core2_Consolidated_20261102/MANIFEST.review.json"
      - "tools/wpe_student_journey_r1_ui.py"
      - "tools/wpe_d3d4_self_tutor_ui.py"
      - "tests/test_wpe_d3d4_self_tutor.py"
      - ".github/workflows/wpe-d3d4-self-tutor.yml"
  push:
    branches: [main]
    paths:
      - "physics/wpe/d3d4-self-tutor.html"
      - "physics/wpe/d3d4-self-tutor.css"
      - "physics/wpe/d3d4-self-tutor.js"
      - "physics/wpe/d3d4-self-tutor.review.json"
      - "physics/wpe/index.html"
      - "physics/wpe/reasoning-paths.html"
      - "physics/wpe/question-coverage.html"
      - "preview/question-status.html"
      - "workspace/output/WPE_Core2_Consolidated_20261102/MANIFEST.review.json"
      - "tools/wpe_student_journey_r1_ui.py"
      - "tools/wpe_d3d4_self_tutor_ui.py"
      - "tests/test_wpe_d3d4_self_tutor.py"
      - ".github/workflows/wpe-d3d4-self-tutor.yml"
jobs:
  self-tutor-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.55.0 pytest>=8
          python -m playwright install --with-deps chromium
      - name: Static source, academic boundary and scientific checks
        run: python -m pytest -q tests/test_wpe_d3d4_self_tutor.py
      - name: Browser walkthrough of thirteen C01–C08 and E01–E05 six-stage journeys
        run: python tools/wpe_d3d4_self_tutor_ui.py
      - name: Source question to C03 tutor and full coverage across desktop/mobile
        run: python tools/wpe_student_journey_r1_ui.py
