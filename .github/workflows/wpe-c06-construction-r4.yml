name: WPE C06 Construction R4 — Physics and Browser
on:
  pull_request:
    paths:
      - "physics/wpe/c06-constructions-r4.js"
      - "physics/wpe/c06-constructions-r4.html"
      - "physics/wpe/c06-constructions-r4.css"
      - "physics/wpe/c06-source-r4.js"
      - "physics/wpe/reviews/WPE_C06_CONSTRUCTION_R4_AUDIT.md"
      - "tests/test_wpe_c06_construction_r4.py"
      - "tools/wpe_c06_construction_r4_ui.py"
      - ".github/workflows/wpe-c06-construction-r4.yml"
  workflow_dispatch:
jobs:
  source-physics-and-real-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project QA and actual Chromium browser
        run: |
          python -m pip install -e ".[dev]" playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Validate JavaScript syntax without changing merged C06 or R3
        run: |
          node --check physics/wpe/c06-constructions-r4.js
          node --check physics/wpe/c06-source-r4.js
      - name: Source figures and 74-bank identity, independent physics, limiting/negative cases
        run: python -m pytest -q tests/test_wpe_c06_construction_r4.py
      - name: Ten separate A/B problems; actual full six-stage desktop and mobile runs; exact source returns
        run: python tools/wpe_c06_construction_r4_ui.py
