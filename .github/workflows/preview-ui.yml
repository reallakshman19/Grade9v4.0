name: Preview tablet and practice UI QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "preview/**"
      - "site-nav.js"
      - "tools/preview_ui_regression.py"
      - ".github/workflows/preview-ui.yml"
  push:
    branches: [main]
    paths:
      - "preview/**"
      - "site-nav.js"
      - "tools/preview_ui_regression.py"
      - ".github/workflows/preview-ui.yml"
jobs:
  preview-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium browser testing
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test preview navigation and original practice journey at tablet sizes
        run: python tools/preview_ui_regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-tablet-screenshots
          path: preview-ui-artifacts/
          if-no-files-found: ignore
